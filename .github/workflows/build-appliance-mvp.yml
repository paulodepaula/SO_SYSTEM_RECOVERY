name: Build RedeTI Recovery OS Appliance MVP ISO
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-appliance-mvp.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redeti-appliance-mvp-iso
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ISO tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools curl ca-certificates file qemu-system-x86 socat python3-pil
      - name: Validate code before expensive build
        run: python3 -m unittest discover -s appliance/tests -v
      - name: Compile native LVGL app inside isolated Arch Linux container
        run: |
          bash appliance/build/build-native-arch.sh
          test -s "$HOME/RecoveryOS/native-build/out/redeti-ui"
      - name: Download verified SystemRescue base
        env:
          ISO_URL: https://fastly-cdn.system-rescue.org/releases/13.02/systemrescue-13.02-amd64.iso
          BASE_SHA256: ad4d670b72859d887c7960142a9a9d36a3e50446694a035e254442f65d6e7572
        run: |
          mkdir -p dist/base dist/out
          curl --fail --location --retry 4 --retry-delay 10 --output dist/base/systemrescue-13.02-amd64.iso "$ISO_URL"
          echo "$BASE_SHA256  dist/base/systemrescue-13.02-amd64.iso" | sha256sum --check --status
      - name: Install upstream SystemRescue ISO customizer
        run: |
          curl --fail --location --retry 4 --retry-delay 5             'https://gitlab.com/systemrescue/systemrescue-sources/-/raw/main/airootfs/usr/share/sysrescue/bin/sysrescue-customize?inline=false'             --output /tmp/sysrescue-customize
          test -s /tmp/sysrescue-customize
          head -n 1 /tmp/sysrescue-customize | grep -q bash
          sudo install -m 0755 /tmp/sysrescue-customize /usr/local/bin/sysrescue-customize
      - name: Compose native Appliance ISO with optional VPN and SSH
        run: |
          bash appliance/build/build-local.sh             dist/base/systemrescue-13.02-amd64.iso dist/out
          test "$(find dist/out -maxdepth 1 -name 'RedeTI-Recovery-OS-appliance-*.iso' | wc -l)" -eq 1
      - name: Verify file integrity and boot media structure
        run: |
          cd dist/out
          f="$(find . -maxdepth 1 -type f -name 'RedeTI-Recovery-OS-appliance-*.iso' -print -quit)"
          test -s "$f"
          sha256sum -c "$f.sha256"
          xorriso -indev "$f" -ls /sysrescue.d
          file "$f"
          du -h "$f"
      - name: Boot QEMU and validate real DRM dashboard before publishing ISO
        shell: bash
        run: |
          set -euo pipefail
          iso="$(find dist/out -maxdepth 1 -type f -name 'RedeTI-Recovery-OS-appliance-*.iso' -print -quit)"
          test -s "$iso"
          mkdir -p shots
          qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu max -m 3072 -smp 2 \
            -device virtio-vga -device qemu-xhci -device usb-tablet -device usb-kbd \
            -drive "file=$iso,media=cdrom,readonly=on" -boot order=d \
            -nic none -display none -vnc 127.0.0.1:0 \
            -monitor unix:/tmp/recovery-qa.sock,server,nowait \
            -pidfile /tmp/recovery-qa.pid -daemonize
          trap 'kill "$(cat /tmp/recovery-qa.pid)" 2>/dev/null || true' EXIT
          for time in 70 140 210; do
            sleep 70
            printf 'screendump %s/shots/boot-%s.ppm\n' "$PWD" "$time" |
              socat -T 20 - UNIX-CONNECT:/tmp/recovery-qa.sock > "shots/monitor-$time.log" 2>&1 || true
          done
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          good = False
          for f in sorted(Path("shots").glob("boot-*.ppm")):
              im=Image.open(f).convert("RGB")
              im.thumbnail((320,240))
              im.save(f.with_suffix(".png"))
              px=list(im.getdata())
              # Black SystemRescue login is not the blue/redeti dashboard.
              blue=sum(b>30 and b>r*1.35 and b>g*1.11 for r,g,b in px)/len(px)
              print(f.name, "blue dashboard share:", round(blue,3))
              good = good or blue > 0.16
          if not good:
              raise SystemExit("Boot gate failed: no blue RedeTI dashboard observed in QEMU")
          PY
      - name: Preserve QEMU screenshots (even if boot fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RedeTI-MVP-boot-qa
          path: |
            shots/*.png
            shots/monitor-*.log
          retention-days: 1
          if-no-files-found: warn
      - name: Upload only latest lab ISO (expires after one day)
        uses: actions/upload-artifact@v4
        with:
          name: RedeTI-Recovery-OS-appliance-MVP-v0.6.0
          path: |
            dist/out/RedeTI-Recovery-OS-appliance-*.iso
            dist/out/RedeTI-Recovery-OS-appliance-*.iso.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
