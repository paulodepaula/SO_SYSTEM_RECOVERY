name: Recovery OS unit tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run isolated tests (no real devices)
        run: python -m pytest -q
      - name: Validate Recovery OS launcher shell syntax
        run: bash -n boot_gui/build/launch.sh boot_gui/build/compose_iso.sh boot_gui/build/build-local.sh scripts/prune-recovery-isos.sh
      - name: Check systemd service syntax
        run: systemd-analyze verify boot_gui/systemd/redeti-cockpit.service
      - name: Test graphical Recovery OS backend (simulated inventory)
        run: python -m unittest discover -s boot_gui/tests -v
      - name: Test direct-boot appliance hardware recognition
        run: python -m unittest discover -s appliance/tests -v
